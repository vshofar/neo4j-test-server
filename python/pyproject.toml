[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neo4j-test-server"
version = "0.1.0"
description = "Disposable in-process Neo4j test server for Python integration tests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vshofar" }]
keywords = ["neo4j", "testing", "integration-tests", "graph-database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "neo4j>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.entry-points.pytest11]
neo4j_test_server = "neo4j_test_server.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/neo4j_test_server"]
