name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Build fat JAR
        run: ./gradlew shadowJar

      - uses: actions/upload-artifact@v4
        with:
          name: neo4j-test-server-all
          path: build/libs/neo4j-test-server-all.jar
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    needs: kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: neo4j-test-server-all
          path: build/libs

      - name: Install package
        run: pip install -e python/

      - name: Run package tests
        env:
          NEO4J_TEST_SERVER_JAR: ${{ github.workspace }}/build/libs/neo4j-test-server-all.jar
        run: python -m pytest python/tests/ -v
